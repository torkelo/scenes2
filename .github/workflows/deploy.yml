name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/design-site/**'
      - 'apps/storybook/**'
      - 'packages/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build design-site
        run: pnpm turbo run build --filter=@grafana/design-site

      - name: Build storybook
        env:
          STORYBOOK_BASE_PATH: /storybook/
        run: pnpm turbo run build-storybook --filter=@grafana/storybook

      - name: Embed storybook under /storybook
        run: cp -R apps/storybook/storybook-static apps/design-site/dist/storybook

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/design-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
