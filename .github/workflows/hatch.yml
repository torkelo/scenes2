name: Hatch

# Verifies the per-agent config files (CLAUDE.md, AGENTS.md, .claude/, .cursor/,
# .agents/) are in sync with their .hatch/ source AND formatted. Runs as its own
# workflow because the main CI workflow ignores `*.md` / `.claude/**` changes —
# exactly when the hatch-generated files move.
#
# It runs the same `pnpm hatch:gen` contributors run (hatch gen + prettier), then
# fails if anything changed. v1.2.0 has no `hatch check`, so this is the gate.
on:
  pull_request:
    branches: [main]

concurrency:
  group: hatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify generated agent config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies (for prettier)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup mise (provisions pinned hatch)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Regenerate and verify nothing changed
        run: |
          pnpm hatch:gen
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated agent config is out of date. Run 'pnpm hatch:gen' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
          echo "Generated agent config is up to date."
